<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apple-Loving Squirrel</title>
    <style>
        body { margin: 0; padding: 0; background-color: #333; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; touch-action: none; overflow: hidden; }
        #gameWrapper { width: 100%; max-width: 400px; position: relative; background-color: #f8f9fa; height: 80vh; max-height: 600px; }
        canvas { display: block; width: 100%; height: 100%; }
        
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.85); color: white; text-align: center; z-index: 100; }
        .hidden { display: none !important; }
        
        h1 { font-size: 28px; color: #ffeb3b; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin-bottom: 10px; }
        
        button { padding: 15px 30px; font-size: 20px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; background: #007bff; color: white; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); pointer-events: auto; }
        button:active { transform: translateY(2px); box-shadow: none; background: #0056b3; }

        #controls { display: flex; width: 100%; max-width: 400px; height: 20vh; min-height: 80px; background: #222; }
        .btn { flex: 1; border: 1px solid #444; font-size: 40px; display: flex; justify-content: center; align-items: center; color: white; background: #444; cursor: pointer; user-select: none; touch-action: none; }
        .btn:active { background: #666; }
    </style>
</head>
<body>

<div id="gameWrapper">
    <canvas id="gameCanvas"></canvas>
    
    <div id="startScreen" class="screen">
        <h1>Apple-Loving Squirrel</h1>
        <p>
            <span style="font-size: 1.5em;">🍎</span> キャッチで 1ポイント<br>
            <span style="font-size: 1.5em;">💣</span> 当たると ゲームオーバー<br>
            <span style="font-size: 1.5em;">⭐</span> 取ると 4.5秒間 無敵！<br>
            <span style="color: #ffcccc; font-size: 0.9em;">※🍎を落とすと -1ポイント</span>
        </p>
        <p style="font-size: 14px; color: #ccc;">【操作】<br>左右ボタン(キー)を押している間だけ移動<br>離すと真ん中に戻ります</p>
        <button id="startBtn">スタート</button>
    </div>

    <div id="gameOverScreen" class="screen hidden">
        <h2>ゲームオーバー</h2>
        <p>スコア: <span id="finalScore">0</span></p>
        <button id="retryBtn">もう一回</button>
    </div>
</div>

<div id="controls">
    <div id="leftBtn" class="btn">←</div>
    <div id="rightBtn" class="btn">→</div>
</div>

<script>
    function createEmojiCache(emoji, size) {
        const c = document.createElement('canvas');
        c.width = size * 1.5;
        c.height = size * 1.5;
        const tmpCtx = c.getContext('2d');
        tmpCtx.font = `${size}px sans-serif`;
        tmpCtx.textAlign = 'center';
        tmpCtx.textBaseline = 'top';
        tmpCtx.fillText(emoji, c.width / 2, 0);
        return c;
    }

    const EMOJI_SIZE = 50;
    const cacheApple = createEmojiCache('🍎', EMOJI_SIZE);
    const cacheBomb = createEmojiCache('💣', EMOJI_SIZE);
    const cacheStar = createEmojiCache('⭐', EMOJI_SIZE);

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // --- 【変更】画質と軽さのバランスを調整（上限を1.5にしてラグを軽減） ---
    const GAME_WIDTH = 400;
    const GAME_HEIGHT = 600;
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5); 
    canvas.width = GAME_WIDTH * dpr;
    canvas.height = GAME_HEIGHT * dpr;
    ctx.scale(dpr, dpr);

    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreText = document.getElementById('finalScore');
    const startBtn = document.getElementById('startBtn');
    const retryBtn = document.getElementById('retryBtn');

    const playerImg = new Image();
    playerImg.src = 'リス.png';

    const bgm = new Audio('bgm.mp3');
    bgm.loop = true;
    bgm.volume = 0.5;

    const seApple = new Audio('apple.mp3');
    const seBomb = new Audio('bomb.mp3');
    const seStar = new Audio('star.mp3');

    function playSE(audioObj) {
        audioObj.currentTime = 0;
        audioObj.play().catch(e => console.log("音声再生エラー:", e));
    }

    let gameState = 'START'; 
    let score = 0;
    let frameCount = 0;
    let animationId;
    let invincibleUntil = 0;

    const TOTAL_LANES = 3;
    let LANE_WIDTH = GAME_WIDTH / TOTAL_LANES;

    const player = {
        lane: 1, width: 60, height: 60, color: '#007bff'
    };
    let items = [];

    let isLeftPressed = false;
    let isRightPressed = false;

    function updatePlayerLane() {
        if (isLeftPressed && !isRightPressed) {
            player.lane = 0;
        } else if (isRightPressed && !isLeftPressed) {
            player.lane = 2;
        } else {
            player.lane = 1;
        }
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') isLeftPressed = true;
        if (e.key === 'ArrowRight') isRightPressed = true;
        updatePlayerLane();
    });
    document.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') isLeftPressed = false;
        if (e.key === 'ArrowRight') isRightPressed = false;
        updatePlayerLane();
    });

    const setupButton = (id, isLeft) => {
        const btn = document.getElementById(id);
        const press = (e) => {
            e.preventDefault();
            if (isLeft) isLeftPressed = true; else isRightPressed = true;
            updatePlayerLane();
        };
        const release = (e) => {
            e.preventDefault();
            if (isLeft) isLeftPressed = false; else isRightPressed = false;
            updatePlayerLane();
        };

        btn.addEventListener('touchstart', press, { passive: false });
        btn.addEventListener('mousedown', press);
        btn.addEventListener('touchend', release, { passive: false });
        btn.addEventListener('mouseup', release);
        btn.addEventListener('mouseleave', release);
    };

    setupButton('leftBtn', true);
    setupButton('rightBtn', false);

    function initGame() {
        score = 0;
        frameCount = 0;
        items = [];
        invincibleUntil = 0;
        isLeftPressed = false;
        isRightPressed = false;
        updatePlayerLane();
        
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        gameState = 'PLAYING';
        
        bgm.currentTime = 0;
        bgm.play().catch(e => console.log("BGM再生エラー:", e));
        
        if (animationId) cancelAnimationFrame(animationId);
        gameLoop();
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        cancelAnimationFrame(animationId);
        finalScoreText.textContent = score;
        gameOverScreen.classList.remove('hidden');
        bgm.pause();
    }

    function spawnItem() {
        let difficultyScore = Math.max(0, score);
        let spawnRate = Math.max(12, 30 - Math.floor(difficultyScore * 0.5)); 
        
        if (frameCount % spawnRate === 0) {
            let targetLane = Math.floor(Math.random() * TOTAL_LANES);
            let rand = Math.random();
            let type;
            
            let isInvincible = Date.now() < invincibleUntil;
            
            let starChance = 0.05;
            if (difficultyScore > 20) starChance = 0.03;
            if (difficultyScore > 40) starChance = 0.01;
            if (isInvincible) starChance = 0; 

            if (rand < starChance) {
                type = 'STAR';
            } else if (rand < 0.7) {
                type = 'GOOD';
            } else {
                type = 'BAD';
            }
            
            items.push({
                lane: targetLane,
                y: -50,
                size: EMOJI_SIZE, 
                type: type,
                speed: 5 + Math.random() * 3 + (difficultyScore * 0.15) 
            });
        }
    }

    function update() {
        let playerY = GAME_HEIGHT - player.height - 20;
        let isInvincible = Date.now() < invincibleUntil;

        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            item.y += item.speed;

            if (item.lane === player.lane && 
                item.y + item.size > playerY && 
                item.y < playerY + player.height) {
                
                if (item.type === 'STAR') {
                    playSE(seStar);
                    invincibleUntil = Date.now() + 4500;
                    items.splice(i, 1);
                } else if (item.type === 'GOOD') {
                    playSE(seApple);
                    score++; 
                    items.splice(i, 1);
                } else if (item.type === 'BAD') {
                    if (isInvincible) {
                        playSE(seBomb);
                        items.splice(i, 1);
                    } else {
                        playSE(seBomb);
                        gameOver(); 
                        return;
                    }
                }
            } 
            else if (item.y > GAME_HEIGHT) {
                if (item.type === 'GOOD') {
                    score--;
                }
                items.splice(i, 1);
            }
        }
    }

    function draw() {
        ctx.fillStyle = '#f8f9fa';
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        let playerY = Math.floor(GAME_HEIGHT - player.height - 20);
        let playerX = Math.floor((player.lane * LANE_WIDTH) + (LANE_WIDTH / 2) - (player.width / 2));
        
        let isInvincible = Date.now() < invincibleUntil;
        let timeRemaining = invincibleUntil - Date.now();
        let shouldDrawPlayer = true;

        if (isInvincible) {
            if (timeRemaining <= 1000) {
                if (Math.floor(Date.now() / 100) % 2 === 0) {
                    shouldDrawPlayer = false; 
                }
            }
        }

        if (shouldDrawPlayer) {
            if (playerImg.complete && playerImg.naturalWidth > 0) {
                
                // --- 【変更】リスの形に光るエフェクトを復活！ ---
                // ※ラグ軽減のため、光の広がり（Blur）を25から15に少しだけ下げています
                if (isInvincible) {
                    ctx.shadowBlur = 15; 
                    ctx.shadowColor = `hsl(${(frameCount * 15) % 360}, 100%, 50%)`;
                }
                
                ctx.drawImage(playerImg, playerX, playerY, player.width, player.height);
                
                // 影をリセット
                ctx.shadowBlur = 0;

            } else {
                ctx.fillStyle = player.color;
                ctx.fillRect(playerX, playerY, player.width, player.height);
            }
        }

        for (let item of items) {
            let itemX = Math.floor((item.lane * LANE_WIDTH) + (LANE_WIDTH / 2));
            let itemY = Math.floor(item.y);
            let imgCache;
            
            if (item.type === 'STAR') imgCache = cacheStar;
            else if (item.type === 'GOOD') imgCache = cacheApple;
            else imgCache = cacheBomb;

            ctx.drawImage(imgCache, Math.floor(itemX - imgCache.width / 2), itemY);
        }

        ctx.fillStyle = '#333';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`スコア: ${score}`, 15, 20);
    }

    function gameLoop() {
        if (gameState !== 'PLAYING') return;
        frameCount++;
        
        spawnItem();
        update();
        draw();

        animationId = requestAnimationFrame(gameLoop);
    }

    startBtn.onclick = initGame;
    retryBtn.onclick = initGame;

    playerImg.onload = () => { draw(); };
    draw();
</script>
</body>
</html>
