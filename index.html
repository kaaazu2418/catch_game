<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apple-Loving Squirrel</title>
    <style>
        body { margin: 0; padding: 0; background-color: #333; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; touch-action: none; overflow: hidden; }
        
        #gameWrapper { width: 100%; max-width: 400px; position: relative; height: 80vh; max-height: 600px; background-color: #f8f9fa; }
        
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
        #bgCanvas { z-index: 10; }
        #gameCanvas { z-index: 20; }

        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.85); color: white; text-align: center; z-index: 100; }
        .hidden { display: none !important; }
        
        h1 { font-size: 28px; color: #ffeb3b; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin-bottom: 10px; }
        
        button { padding: 15px 30px; font-size: 20px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; background: #007bff; color: white; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); pointer-events: auto; }
        button:active { transform: translateY(2px); box-shadow: none; background: #0056b3; }

        #controls { display: flex; width: 100%; max-width: 400px; height: 20vh; min-height: 80px; background: #222; }
        .btn { flex: 1; border: 1px solid #444; font-size: 40px; display: flex; justify-content: center; align-items: center; color: white; background: #444; cursor: pointer; user-select: none; touch-action: none; }
        .btn:active { background: #666; }
    </style>
</head>
<body>

<div id="gameWrapper">
    <canvas id="bgCanvas"></canvas>
    <canvas id="gameCanvas"></canvas>
    
    <div id="startScreen" class="screen">
        <h1>Apple-Loving Squirrel</h1>
        <p>
            <span style="font-size: 1.5em;">🍎</span> キャッチで 1ポイント<br>
            <span style="font-size: 1.5em;">💣</span> 当たると ゲームオーバー<br>
            <span style="font-size: 1.5em;">⭐</span> 取ると 4.5秒間 無敵！<br>
            <span style="color: #ffcccc; font-size: 0.9em;">※🍎を落とすと -1ポイント</span>
        </p>
        <p style="font-size: 14px; color: #ccc;">【操作】<br>左右ボタン(キー)を押している間だけ移動<br>離すと真ん中に戻ります</p>
        <button id="startBtn">スタート</button>
    </div>

    <div id="gameOverScreen" class="screen hidden">
        <h2>ゲームオーバー</h2>
        <p>スコア: <span id="finalScore">0</span></p>
        <button id="retryBtn">もう一回</button>
    </div>
</div>

<div id="controls">
    <div id="leftBtn" class="btn">←</div>
    <div id="rightBtn" class="btn">→</div>
</div>

<script>
    const GOOD_MARK = '🍎';
    const BAD_MARK = '💣';
    const STAR_MARK = '⭐';

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    
    const GAME_WIDTH = 400;
    const GAME_HEIGHT = 600;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.0); 
    
    canvas.width = GAME_WIDTH * dpr;
    canvas.height = GAME_HEIGHT * dpr;
    ctx.scale(dpr, dpr);
    
    bgCanvas.width = GAME_WIDTH * dpr;
    bgCanvas.height = GAME_HEIGHT * dpr;
    bgCtx.scale(dpr, dpr);

    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreText = document.getElementById('finalScore');
    const startBtn = document.getElementById('startBtn');
    const retryBtn = document.getElementById('retryBtn');

    let gameState = 'START'; 
    let score = 0;
    let animationId;
    let invincibleUntil = 0;
    
    let lastTime = 0;
    let itemSpawnTimer = 0;
    let effectFrame = 0;

    const TOTAL_LANES = 3;
    let LANE_WIDTH = GAME_WIDTH / TOTAL_LANES;

    const player = { lane: 1, width: 60, height: 60 };
    let isLeftPressed = false;
    let isRightPressed = false;

    // --- Web Audio API による遅延ゼロ音声管理 ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    const audioBuffers = { bgm: null, apple: null, bomb: null, star: null };

    async function loadAudio(name, url) {
        try {
            const response = await fetch(url);
            const arrayBuffer = await response.arrayBuffer();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            audioBuffers[name] = audioBuffer;
        } catch (e) {
            console.warn(`音声ファイル ${url} が読み込めませんでした。`);
        }
    }

    loadAudio('bgm', 'bgm.mp3');
    loadAudio('apple', 'apple.mp3');
    loadAudio('bomb', 'bomb.mp3');
    loadAudio('star', 'star.mp3');

    function playSE(name) {
        if (!audioBuffers[name]) return;
        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffers[name];
        source.connect(audioCtx.destination);
        source.start(0);
    }

    let bgmSource = null;
    function playBGM() {
        if (!audioBuffers['bgm']) return;
        stopBGM();
        bgmSource = audioCtx.createBufferSource();
        bgmSource.buffer = audioBuffers['bgm'];
        bgmSource.loop = true;
        
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.5;
        bgmSource.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        bgmSource.start(0);
    }

    function stopBGM() {
        if (bgmSource) {
            bgmSource.stop();
            bgmSource = null;
        }
    }

    // --- オブジェクトプーリング（ラグ対策） ---
    const MAX_ITEMS = 20;
    const itemPool = [];
    for (let i = 0; i < MAX_ITEMS; i++) {
        itemPool.push({ active: false, lane: 0, y: 0, size: 50, type: 'GOOD', mark: GOOD_MARK, speed: 0 });
    }

    function getFreeItem() {
        for (let i = 0; i < itemPool.length; i++) {
            if (!itemPool[i].active) return itemPool[i];
        }
        return null;
    }

    // --- 画像管理 ---
    const playerImg = new Image();
    playerImg.src = 'リス.png';
    playerImg.onload = () => { draw(); };

    const bgImg = new Image();
    bgImg.src = 'back.jpg'; 
    bgImg.onload = () => {
        bgCtx.drawImage(bgImg, 0, 0, GAME_WIDTH, GAME_HEIGHT);
    };
    bgImg.onerror = () => { 
        bgCtx.fillStyle = '#f8f9fa';
        bgCtx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    };

    // --- 操作処理 ---
    function updatePlayerLane() {
        if (isLeftPressed && !isRightPressed) player.lane = 0;
        else if (isRightPressed && !isLeftPressed) player.lane = 2;
        else player.lane = 1;
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') isLeftPressed = true;
        if (e.key === 'ArrowRight') isRightPressed = true;
        updatePlayerLane();
    });
    document.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') isLeftPressed = false;
        if (e.key === 'ArrowRight') isRightPressed = false;
        updatePlayerLane();
    });

    const setupButton = (id, isLeft) => {
        const btn = document.getElementById(id);
        const press = (e) => { e.preventDefault(); if (isLeft) isLeftPressed = true; else isRightPressed = true; updatePlayerLane(); };
        const release = (e) => { e.preventDefault(); if (isLeft) isLeftPressed = false; else isRightPressed = false; updatePlayerLane(); };

        btn.addEventListener('touchstart', press, { passive: false });
        btn.addEventListener('mousedown', press);
        btn.addEventListener('touchend', release, { passive: false });
        btn.addEventListener('mouseup', release);
        btn.addEventListener('mouseleave', release);
    };

    setupButton('leftBtn', true);
    setupButton('rightBtn', false);

    // --- ゲームループ関連 ---
    function initGame() {
        score = 0; 
        invincibleUntil = 0;
        lastTime = performance.now();
        itemSpawnTimer = 0;
        effectFrame = 0;
        
        itemPool.forEach(item => item.active = false);
        
        isLeftPressed = false; 
        isRightPressed = false; 
        updatePlayerLane();
        
        startScreen.classList.add('hidden'); 
        gameOverScreen.classList.add('hidden');
        gameState = 'PLAYING';
        
        // スマホの音声ロック解除
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        playBGM();
        
        if (animationId) cancelAnimationFrame(animationId);
        animationId = requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        cancelAnimationFrame(animationId);
        finalScoreText.textContent = score;
        gameOverScreen.classList.remove('hidden');
        stopBGM();
    }

    function spawnItem(deltaTime) {
        let difficultyScore = Math.max(0, score);
        let spawnIntervalMs = Math.max(200, 500 - (difficultyScore * 8)); 
        
        itemSpawnTimer += deltaTime;
        
        if (itemSpawnTimer > spawnIntervalMs) {
            itemSpawnTimer = 0; 
            
            const newItem = getFreeItem();
            if (!newItem) return;

            let targetLane = Math.floor(Math.random() * TOTAL_LANES);
            let rand = Math.random();
            let type, mark;
            let isInvincible = Date.now() < invincibleUntil;
            let starChance = 0.05;
            if (difficultyScore > 20) starChance = 0.03;
            if (difficultyScore > 40) starChance = 0.01;
            if (isInvincible) starChance = 0; 

            if (rand < starChance) { type = 'STAR'; mark = STAR_MARK; }
            else if (rand < 0.7)   { type = 'GOOD'; mark = GOOD_MARK; }
            else                   { type = 'BAD';  mark = BAD_MARK; }
            
            let baseSpeed = 300 + (Math.random() * 150) + (difficultyScore * 10);
            
            newItem.active = true;
            newItem.lane = targetLane; 
            newItem.y = -50; 
            newItem.type = type; 
            newItem.mark = mark;
            newItem.speed = baseSpeed; 
        }
    }

    function update(deltaTime) {
        let playerY = GAME_HEIGHT - player.height - 20;
        let isInvincible = Date.now() < invincibleUntil;

        for (let i = 0; i < itemPool.length; i++) {
            let item = itemPool[i];
            if (!item.active) continue;

            item.y += item.speed * (deltaTime / 1000);

            if (item.lane === player.lane && item.y + item.size > playerY && item.y < playerY + player.height) {
                if (item.type === 'STAR') {
                    playSE('star'); 
                    invincibleUntil = Date.now() + 4500; 
                    item.active = false;
                } else if (item.type === 'GOOD') {
                    playSE('apple'); 
                    score++; 
                    item.active = false;
                } else if (item.type === 'BAD') {
                    if (isInvincible) { 
                        playSE('bomb'); 
                        item.active = false; 
                    } else { 
                        playSE('bomb'); 
                        gameOver(); 
                        return; 
                    }
                }
            } 
            else if (item.y > GAME_HEIGHT) {
                if (item.type === 'GOOD') score--;
                item.active = false;
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        let playerY = Math.floor(GAME_HEIGHT - player.height - 20);
        let playerX = Math.floor((player.lane * LANE_WIDTH) + (LANE_WIDTH / 2) - (player.width / 2));
        
        let isInvincible = Date.now() < invincibleUntil;
        let timeRemaining = invincibleUntil - Date.now();
        let shouldDrawPlayer = true;

        if (isInvincible && timeRemaining <= 1000) {
            if (Math.floor(Date.now() / 100) % 2 === 0) shouldDrawPlayer = false; 
        }

        if (shouldDrawPlayer) {
            if (isInvincible) {
                effectFrame += 5; // 虹色の変化スピード
                ctx.shadowBlur = 20; 
                ctx.shadowColor = `hsl(${effectFrame % 360}, 100%, 60%)`;
            }

            if (playerImg.complete && playerImg.naturalWidth > 0) {
                ctx.drawImage(playerImg, playerX, playerY, player.width, player.height);
            } else {
                ctx.fillStyle = '#007bff';
                ctx.fillRect(playerX, playerY, player.width, player.height);
            }

            ctx.shadowBlur = 0;
        }

        ctx.font = '50px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        for (let i = 0; i < itemPool.length; i++) {
            let item = itemPool[i];
            if (!item.active) continue;
            let itemX = Math.floor((item.lane * LANE_WIDTH) + (LANE_WIDTH / 2));
            let itemY = Math.floor(item.y);
            ctx.fillText(item.mark, itemX, itemY);
        }

        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.fillRect(5, 5, 120, 35);
        ctx.fillStyle = '#333';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`スコア: ${score}`, 15, 10);
    }

    function gameLoop(currentTime) {
        if (gameState !== 'PLAYING') return;
        
        let deltaTime = currentTime - lastTime;
        lastTime = currentTime;
        
        if (deltaTime > 100) deltaTime = 16;
        
        spawnItem(deltaTime); 
        update(deltaTime); 
        draw();
        
        animationId = requestAnimationFrame(gameLoop);
    }

    startBtn.onclick = initGame;
    retryBtn.onclick = initGame;
    
</script>
</body>
</html>
